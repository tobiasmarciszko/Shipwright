name: generate-builds
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    needs: generate-soh-otr
    runs-on: macos-15
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Macports
      uses: melusina-org/setup-macports@v1
    - name: Build dependencies for macOS 11
      run: |
        # Prebuilt MacPorts archives target the runner's OS (macOS 14) and fail
        # to load on older systems, so build the bundled libraries from source
        # with an explicit deployment target.
        conf=/opt/local/etc/macports/macports.conf
        grep -q '^macosx_deployment_target' "$conf" || echo 'macosx_deployment_target 11.0' | sudo tee -a "$conf"
        grep -q '^buildfromsource' "$conf" || echo 'buildfromsource always' | sudo tee -a "$conf"
        # Downloads from the MacPorts mirrors fail now and then; ports that are
        # already installed are kept, so retrying only redoes the failed one.
        for attempt in 1 2 3 4 5; do
          if sudo port -N install libsdl2 libsdl2_net libpng glew libzip nlohmann-json tinyxml2 libogg libopus opusfile libvorbis +universal; then
            exit 0
          fi
          echo "port install failed (attempt $attempt), retrying in 60s"
          sleep 60
        done
        exit 1
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }} # ccache-macos-{{ timestamp }}
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake -j
        # Spotlight indexing the disk image CPack just made keeps hdiutil from
        # unmounting it, failing the build with "Resource busy"
        sudo mdutil -a -i off || true
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Verify macOS 11 compatibility
      run: |
        hdiutil attach SoH.dmg -mountpoint /tmp/soh-dmg -nobrowse -readonly
        fail=0
        while IFS= read -r f; do
          file -b "$f" | grep -q 'Mach-O' || continue
          for v in $(vtool -show-build "$f" | awk '$1=="minos"||$1=="version"{print $2}'); do
            echo "$v $f"
            if [ "${v%%.*}" -gt 11 ]; then fail=1; echo "::error::$f requires macOS $v"; fi
          done
        done < <(find /tmp/soh-dmg/soh.app/Contents/MacOS /tmp/soh-dmg/soh.app/Contents/Frameworks -type f)
        hdiutil detach /tmp/soh-dmg
        exit $fail
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-mac
        path: |
          SoH.dmg
          readme.txt

